<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notepad · Layout sketches</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e4e6e9; background: #191c21; }
    body { margin: 0; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .intro { color: #9da3ad; margin: 0 0 24px; font-size: 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    legend { color: #9da3ad; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
    .choices { display: flex; flex-wrap: wrap; gap: 4px; }
    .choices label { position: relative; cursor: pointer; }
    .choices input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .choices span, button { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; border: 1px solid #3b414b; border-radius: 6px; background: transparent; color: inherit; font: inherit; font-size: 12px; }
    .choices input:checked + span { background: #e1e4e9; border-color: #e1e4e9; color: #20242b; }
    .choices input:focus-visible + span, button:focus-visible { outline: 2px solid #bec9da; outline-offset: 3px; }
    button { cursor: pointer; }
    button:hover { background: #363c45; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .sketch { min-width: 0; }
    .caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .description { min-height: 42px; margin: 0 0 16px; color: #9da3ad; font-size: 13px; line-height: 1.5; }
    .canvas { --bg: #24282f; --panel: #2e333b; --line: #444a54; --selected: #454c57; --edge: 1px; background: var(--bg); padding: 20px 16px 0; height: 430px; overflow: hidden; border: 1px solid #444a54; border-radius: 10px; }
    .app-nav { height: 42px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; color: #999fa9; font-size: 10px; }
    .logo { width: 17px; height: 17px; border: 2px solid #aeb5c0; border-radius: 50%; flex-shrink: 0; }
    .nav-current { background: #444a54; color: #eee; padding: 6px 8px; border-radius: 6px; }
    .nav-end { margin-left: auto; font-size: 14px; }
    .work-area { display: grid; grid-template-columns: minmax(100px, 35%) minmax(0, 1fr); height: calc(100% - 62px); }
    .sidebar { min-width: 0; background: var(--panel); }
    .side-head { height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: var(--edge) solid var(--line); font-size: 11px; }
    .side-head strong { white-space: nowrap; }
    .side-head .plus { margin-left: auto; color: #b7bec9; font-size: 17px; }
    .side-body { padding: 12px 6px; }
    .bucket { padding: 0 7px 8px; color: #9199a5; font-size: 8px; letter-spacing: .12em; }
    .note-row { padding: 9px 7px; border-radius: 6px; margin-bottom: 3px; }
    .note-row.selected { background: var(--selected); }
    .note-row strong { display: block; font-size: 10px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .line { height: 4px; background: #747d8b; opacity: .35; border-radius: 2px; margin-top: 7px; }
    .line.short { width: 55%; }
    .stamp { display: block; margin-top: 6px; color: #939ca9; font-size: 8px; }
    .editor { min-width: 0; padding: 0 16px; }
    .editor-head { min-height: 48px; display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .editor-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .editor-tools { display: flex; gap: 4px; flex-shrink: 0; }
    .tool { display: grid; place-items: center; width: 23px; height: 23px; border: var(--edge) solid var(--line); border-radius: 6px; font-size: 12px; color: #b5bdc9; }
    .copy { color: #b0b7c2; font-size: 10px; line-height: 1.8; margin: 0 0 18px; }
    .editor .line { height: 5px; margin-top: 10px; background: #a7afbb; opacity: .18; }
    .mock-table { border: 1px solid var(--line); border-radius: 4px; margin-top: 20px; }
    .mock-table div { height: 22px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent 48%, var(--line) 48%, var(--line) 49%, transparent 49%); }
    .mock-table div:first-child { background-color: var(--panel); }
    .mock-table div:last-child { border-bottom: 0; }
    /* A: one page surface, a single dividing edge, aligned headers. */
    .integrated .sidebar { border-right: var(--edge) solid var(--line); }
    .integrated .side-head { border-bottom: 0; }
    /* B: both panes belong to a single, finished workspace frame. */
    .workspace .work-area { border: var(--edge) solid var(--line); border-radius: 10px 10px 0 0; overflow: hidden; }
    .workspace .sidebar { border-right: var(--edge) solid var(--line); }
    .workspace .editor { padding: 0; }
    .workspace .editor-head { padding: 0 14px; border-bottom: var(--edge) solid var(--line); margin-bottom: 18px; }
    .workspace .editor-body { padding: 0 14px; }
    /* C: a genuinely separate card, with a complete bottom and top edge. */
    .card .work-area { padding-bottom: 16px; }
    .card .sidebar { border: var(--edge) solid var(--line); border-radius: 10px; overflow: hidden; }
    .card .side-head { border-bottom: var(--edge) solid var(--line); }
    /* Connection and surface weight can be compared on the same layouts. */
    body[data-connection="connected"] .canvas { padding: 0; }
    body[data-connection="connected"] .app-nav { padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); margin-bottom: 0; background: var(--panel); }
    body[data-connection="connected"] .work-area { height: calc(100% - 52px); }
    body[data-connection="connected"] .workspace .work-area { border: 0; border-radius: 0; }
    body[data-connection="connected"] .card .work-area { padding: 14px; }
    body[data-weight="subtle"] .canvas { --panel: #292d34; --line: #343a43; --selected: #3a404a; }
    body[data-weight="framed"] .canvas { --panel: #353b45; --line: #616b7a; --selected: #505b6c; }
    body:not([data-layout="all"]) .gallery { grid-template-columns: minmax(0, 1fr); max-width: 1150px; margin: 0 auto; }
    body:not([data-layout="all"]) .sketch { display: none; }
    body[data-layout="integrated"] .integrated, body[data-layout="workspace"] .workspace, body[data-layout="card"] .card { display: block; }
    body:not([data-layout="all"]) .canvas { height: 550px; }
    body:not([data-layout="all"]) .work-area { grid-template-columns: 260px minmax(0, 1fr); }
    body:not([data-layout="all"]) .editor { padding-inline: 28px; }
    body:not([data-layout="all"]) .workspace .editor { padding-inline: 0; }
    body:not([data-layout="all"]) .editor-title { font-size: 20px; }
    body:not([data-layout="all"]) .copy { font-size: 13px; }
    footer { color: #8d95a2; font-size: 12px; margin-top: 24px; }
    @media (max-width: 1050px) { .gallery { grid-template-columns: 1fr; max-width: 760px; margin-inline: auto; } .description { min-height: 0; } }
    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .controls { gap: 16px; }
      .caption button { padding: 6px 8px; }
      .canvas { padding-inline: 10px; }
      body:not([data-layout="all"]) .work-area { grid-template-columns: minmax(100px, 35%) minmax(0, 1fr); }
      body:not([data-layout="all"]) .editor { padding-inline: 12px; }
      body:not([data-layout="all"]) .editor-title { font-size: 15px; }
      body:not([data-layout="all"]) .copy { font-size: 10px; }
    }
  </style>
</head>
<body data-layout="all" data-connection="separate" data-weight="tonal">
  <h1>Notepad layout sketches</h1>
  <p class="intro">Compare how the sidebar meets the top of the workspace. Lo-fi only — no app changes or real data.</p>
  <div class="controls">
    <fieldset><legend>Layout</legend><div class="choices">
      <label><input type="radio" name="layout" value="all" checked><span>Compare all</span></label>
      <label><input type="radio" name="layout" value="integrated"><span>A · Integrated</span></label>
      <label><input type="radio" name="layout" value="workspace"><span>B · Workspace</span></label>
      <label><input type="radio" name="layout" value="card"><span>C · Card</span></label>
    </div></fieldset>
    <fieldset><legend>Navigation connection</legend><div class="choices">
      <label><input type="radio" name="connection" value="separate" checked><span>Separate navigation</span></label>
      <label><input type="radio" name="connection" value="connected"><span>Connected app shell</span></label>
    </div></fieldset>
    <fieldset><legend>Visual weight</legend><div class="choices">
      <label><input type="radio" name="weight" value="subtle"><span>Subtle</span></label>
      <label><input type="radio" name="weight" value="tonal" checked><span>Tonal</span></label>
      <label><input type="radio" name="weight" value="framed"><span>Defined</span></label>
    </div></fieldset>
  </div>
  <main class="gallery" aria-label="Layout comparisons"></main>
  <footer>Preview controls work. The notes and toolbar inside each sketch are static placeholders.</footer>
  <script>
    const layouts = [
      ['integrated', 'A · Integrated sidebar', 'One continuous page. Aligned headers and a single divider make the sidebar belong to the editor.'],
      ['workspace', 'B · Unified workspace', 'A shared top edge and one outer frame. The sidebar and editor read as two parts of the same workspace.'],
      ['card', 'C · Intentional card', 'The sidebar stays separate, but a complete frame and finished corners make that separation deliberate.'],
    ];
    const notes = ['Reading list', 'Weekend trip', 'Ideas', 'Welcome to Hawk'];
    const gallery = document.querySelector('.gallery');
    for (const [id, title, description] of layouts) {
      const article = document.createElement('article');
      article.className = `sketch ${id}`;
      article.innerHTML = `
        <div class="caption"><h2>${title}</h2><button type="button" data-inspect="${id}" aria-label="Expand ${title}">Expand</button></div>
        <p class="description">${description}</p>
        <div class="canvas" role="img" aria-label="${title}: ${description}">
          <div class="app-nav"><span class="logo"></span><span>Journal</span><span class="nav-current">Notepad</span><span>Extensions</span><span class="nav-end">☼</span></div>
          <div class="work-area">
            <div class="sidebar"><div class="side-head"><strong>All notes</strong><span>4⌄</span><span class="plus">+</span></div>
              <div class="side-body"><div class="bucket">TODAY</div>${notes.map((name, i) => `<div class="note-row ${i === 0 ? 'selected' : ''}"><strong>${name}</strong><div class="line"></div><div class="line short"></div><span class="stamp">${i + 1}h ago</span></div>`).join('')}</div>
            </div>
            <div class="editor"><div class="editor-head"><span class="editor-title">Reading list</span><div class="editor-tools"><span class="tool">⛶</span><span class="tool">⋯</span></div></div>
              <div class="editor-body"><p class="copy">A few books for the coming weeks.</p><div class="mock-table"><div></div><div></div><div></div><div></div></div><div class="line"></div><div class="line short"></div></div>
            </div>
          </div>
        </div>`;
      gallery.append(article);
    }
    document.querySelector('.controls').addEventListener('change', event => {
      const { name, value } = event.target;
      if (['layout', 'connection', 'weight'].includes(name)) document.body.dataset[name] = value;
    });
    gallery.addEventListener('click', event => {
      const button = event.target.closest('[data-inspect]');
      if (!button) return;
      const radio = document.querySelector(`input[name="layout"][value="${button.dataset.inspect}"]`);
      radio.checked = true;
      radio.dispatchEvent(new Event('change', { bubbles: true }));
      document.querySelector('input[name="layout"]:checked').focus();
      window.scrollTo({ top: 0, behavior: 'instant' });
    });
  </script>
</body>
</html>
