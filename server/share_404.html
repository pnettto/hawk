<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Nothing here · Hawk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>try{var t=localStorage.getItem('hawk_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="stylesheet" href="https://use.typekit.net/pmu6sig.css">
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/base.css" />

    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }

      .lost {
        max-width: 34ch;
      }

      .bird {
        width: 132px;
        height: 132px;
        margin: 0 auto 0.5rem;
        animation: hover 4s var(--ease-out) infinite alternate;
      }

      @keyframes hover {
        from { transform: translateY(4px) rotate(-2deg); }
        to { transform: translateY(-4px) rotate(2deg); }
      }

      .code {
        margin: 0;
        font-size: var(--small);
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--muted);
        opacity: 0.7;
      }

      h1 {
        margin: 0.4rem 0 0.6rem;
        font-size: var(--h2);
        font-weight: 800;
        color: var(--accent);
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0;
        line-height: var(--lh);
        color: var(--muted);
        text-wrap: pretty;
      }

      .home {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.55rem 1rem;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--text);
        font-size: var(--small);
        text-decoration: none;
        transition: background var(--dur-fast) var(--ease-out),
          border-color var(--dur-fast) var(--ease-out);
      }

      .home:hover {
        background: var(--glass-dark);
        border-color: var(--line);
      }

      .home:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="lost">
      <svg class="bird" viewBox="0 0 160 160" aria-hidden="true">
        <!-- tail -->
        <path d="M64 104 16 122l4 12 44-18z" fill="var(--accent)"/>
        <path d="M64 108 20 138l6 12 40-28z" fill="var(--accent)" opacity="0.9"/>
        <path d="M64 112 32 150l10 6 26-34z" fill="var(--accent)" opacity="0.8"/>
        <g fill="var(--on-accent)" opacity="0.16">
          <path d="M18 124l3 9 8-3-3-9z"/>
          <path d="M23 140l4 8 8-5-5-8z"/>
          <path d="M35 150l7 4 5-7-8-3z"/>
        </g>

        <!-- perch -->
        <path d="M14 148h132" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>

        <!-- body -->
        <ellipse cx="82" cy="92" rx="28" ry="40" transform="rotate(-6 82 92)" fill="var(--accent)"/>
        <path d="M104 84c6 13 0 27-13 33-11 5-23 1-28-8 12 0 30-10 41-25z" fill="var(--on-accent)" opacity="0.1"/>

        <!-- wing -->
        <path d="M101 64c10 12 8 31-4 45-12 14-30 20-44 20-4 0-5-4-1-6 16-6 30-18 38-32 4-8 7-18 11-27z" fill="var(--on-accent)" opacity="0.16"/>
        <g stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" opacity="0.28" fill="none">
          <path d="M97 78c2 11-3 21-13 28"/>
          <path d="M87 82c2 10-3 19-12 25"/>
          <path d="M75 90c1 7-3 13-9 17"/>
        </g>

        <!-- head -->
        <ellipse cx="97" cy="44" rx="19.5" ry="19" fill="var(--accent)"/>

        <!-- eye and brow -->
        <circle cx="104" cy="42" r="5.5" fill="var(--text)"/>
        <circle cx="105.5" cy="43" r="2.8" fill="var(--bg)"/>
        <circle cx="104.3" cy="41.6" r="0.9" fill="var(--text)"/>
        <path d="M90 30l18 6" stroke="var(--on-accent)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

        <!-- hooked beak -->
        <path d="M108 37c7-1 13 3 16 8 3 5 1 11-3 14-1 1-2 0-2-1 1-3 0-5-2-7-2-2-6-3-9-3z" fill="var(--on-accent)"/>
        <circle cx="112" cy="42" r="1" fill="var(--bg)" opacity="0.45"/>

        <!-- legs and talons -->
        <g stroke="var(--text)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8">
          <path d="M72 126v20"/>
          <path d="M90 126v20"/>
          <path d="M72 146c-4 0-7 1-9 3m9-3c3 0 6 1 8 3m-8-3v4"/>
          <path d="M90 146c-4 0-7 1-9 3m9-3c3 0 6 1 8 3m-8-3v4"/>
        </g>
      </svg>

      <p class="code">404</p>
      <h1>Nothing here</h1>
      <p>This note is private, or the link doesn't point anywhere.</p>
      <a class="home" href="/">Open Hawk</a>
    </main>
  </body>
</html>
