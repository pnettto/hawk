<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Nothing here · Hawk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>try{var t=localStorage.getItem('hawk_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="stylesheet" href="https://use.typekit.net/pmu6sig.css">
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/base.css" />

    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }

      .lost {
        max-width: 34ch;
      }

      .bird {
        width: 132px;
        height: 132px;
        margin: 0 auto 0.5rem;
        animation: hover 4s var(--ease-out) infinite alternate;
      }

      @keyframes hover {
        from { transform: translateY(4px) rotate(-2deg); }
        to { transform: translateY(-4px) rotate(2deg); }
      }

      .code {
        margin: 0;
        font-size: var(--small);
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--muted);
        opacity: 0.7;
      }

      h1 {
        margin: 0.4rem 0 0.6rem;
        font-size: var(--h2);
        font-weight: 800;
        color: var(--accent);
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0;
        line-height: var(--lh);
        color: var(--muted);
        text-wrap: pretty;
      }

      .home {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.55rem 1rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-sm);
        background: var(--surface-subtle);
        color: var(--text);
        font-size: var(--small);
        text-decoration: none;
        transition: background var(--dur-fast) var(--ease-out),
          border-color var(--dur-fast) var(--ease-out);
      }

      .home:hover {
        background: var(--glass-dark);
        border-color: var(--line);
      }

      .home:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="lost">
      <svg class="bird" viewBox="0 0 160 160" aria-hidden="true">
        <!-- perch -->
        <path d="M24 140h112" stroke="var(--line)" stroke-width="4" stroke-linecap="round" />
        <!-- tail -->
        <path d="M112 100 138 116l-7 10-23-14z" fill="var(--accent)" opacity="0.55" />
        <!-- body -->
        <path d="M80 26c25 0 45 21 45 48s-20 48-45 48-45-21-45-48 20-48 45-48z" fill="var(--accent)" />
        <!-- tufts -->
        <path d="m48 40-5-18 20 9z" fill="var(--accent)" />
        <path d="m112 40 5-18-20 9z" fill="var(--accent)" />
        <!-- face -->
        <circle cx="63" cy="76" r="12" fill="var(--bg)" opacity="0.88" />
        <circle cx="97" cy="76" r="12" fill="var(--bg)" opacity="0.88" />
        <circle cx="65" cy="78" r="4.5" fill="var(--accent)" />
        <circle cx="95" cy="78" r="4.5" fill="var(--accent)" />
        <circle cx="63.5" cy="76.5" r="1.6" fill="var(--text)" />
        <circle cx="93.5" cy="76.5" r="1.6" fill="var(--text)" />
        <!-- beak -->
        <path d="m80 88-7 7 7 5 7-5z" fill="var(--bg)" opacity="0.75" />
        <!-- feet -->
        <path d="M70 122v10m20-10v10" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      </svg>

      <p class="code">404</p>
      <h1>Nothing here</h1>
      <p>This note is private, or the link doesn't point anywhere.</p>
      <a class="home" href="/">Open Hawk</a>
    </main>
  </body>
</html>
