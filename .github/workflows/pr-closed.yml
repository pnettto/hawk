# When a PR is closed or merged in the UI:
#   - deletes its Cloudflare Preview (and its Durable Object data);
#   - if closed without merging, closes the issues it would have closed
#     ("Closes #N") as not planned. Merging closes them already.
# A merge made by "/deploy" uses GITHUB_TOKEN, which doesn't fire this event,
# so deploy.yml deletes the Preview itself.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

name: pr-closed

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  cleanup:
    # Fork PRs never get a Preview (and don't get secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted code from main, not the PR branch.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Saved by deploy.yml. Key must match.
      - name: Restore node_modules
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # Fails harmlessly for branches that never had a Preview.
      - name: Delete Preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/deploy.sh delete-preview "$BRANCH"

  close-issues:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for n in $(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences -q '.closingIssuesReferences[].number'); do
            if [ "$(gh issue view "$n" -R "$REPO" --json state -q .state)" = OPEN ]; then
              gh issue close "$n" -R "$REPO" --reason "not planned" --comment "Closed with #$PR."
            fi
          done
