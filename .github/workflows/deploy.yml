# Production deploy to Cloudflare Workers (Worker `hawk`).
#
#   - Every push to main (including merging a PR in the UI; pr-closed.yml then
#     deletes the PR's Preview).
#   - Manually from the Actions tab ("Run workflow").
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".github/pi/**"
      - ".github/workflows/pi.yml"
      - ".github/workflows/pr-closed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Public repo: only the owner may trigger manually.
    if: github.event_name == 'push' || github.actor == 'pnettto'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Also restored by pi.yml and pr-closed.yml. Only saved from here, where
      # the cache accepts writes. Key must match theirs.
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install, test, build
        env:
          CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != true ]; then
            npm ci &
            root_pid=$!
            (cd app && npm ci)
            wait "$root_pid"
          fi
          npm test
          (cd app && npm run build)

      - name: Deploy to prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/deploy.sh prod
